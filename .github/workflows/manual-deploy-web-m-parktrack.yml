name: Manual deploy web to m.parktrack.live

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy. Leave empty to use the selected workflow branch.
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: manual-web-m-parktrack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Flutter Web
    runs-on: ubuntu-latest

    environment:
      name: google-play-release
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate source files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        run: flutter build web --release --base-href / --no-wasm-dry-run

      - name: Add direct-path fallback and custom domain
        run: |
          set -euo pipefail

          cp build/web/index.html build/web/404.html
          printf '%s\n' 'm.parktrack.live' > build/web/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to m.parktrack.live
        id: deployment
        uses: actions/deploy-pages@v4
